<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To Do – Pixel 10 Mockup</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 16px; background: #d9dce2; font-family: system-ui, sans-serif; }
  .phone { position: relative; padding: 14px; background: #111; border-radius: 52px;
           box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .screen { width: 412px; height: 915px; border-radius: 40px; overflow: hidden; background: #fff; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  .camera { position: absolute; top: 26px; left: 50%; width: 14px; height: 14px; margin-left: -7px;
            background: #000; border-radius: 50%; z-index: 2; box-shadow: 0 0 0 2px #222; }
  p { margin: 0; color: #555; font-size: 14px; }
</style>
</head>
<body>
<div class="phone">
  <div class="camera"></div>
  <div class="screen"><iframe src="index.html?demo" title="To Do app"></iframe></div>
</div>
<p>Google Pixel 10 · 412 × 915</p>
</body>
</html>
